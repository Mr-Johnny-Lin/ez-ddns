workflow:
  rules:
    - if: $CI_COMMIT_TAG

default:
  tags:
    - ci-dind-sandbox-runner
  image: docker:24.0.5

stages:
  - build
  - release

variables:
  APP_NAME: "ez-ddns"
  GO_VERSION: "1.25"
  # GitLab Container Registry 配置
  REGISTRY: "${CI_REGISTRY}"
  REGISTRY_IMAGE: "${CI_REGISTRY_IMAGE}"

# 构建 Windows 版本
build-windows:
  stage: build
  image: golang:${GO_VERSION}-alpine
  script:
    - echo "Building Windows executable..."
    - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ${APP_NAME}-windows-amd64.exe .
    - echo "Build completed successfully!"
    - ls -lh ${APP_NAME}-windows-amd64.exe
  artifacts:
    paths:
      - ${APP_NAME}-windows-amd64.exe
    expire_in: 30 days

# 构建 Linux 版本
build-linux:
  stage: build
  image: golang:${GO_VERSION}-alpine
  script:
    - echo "Building Linux executable..."
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ${APP_NAME}-linux-amd64 .
    - chmod +x ${APP_NAME}-linux-amd64
    - echo "Build completed successfully!"
    - ls -lh ${APP_NAME}-linux-amd64
  artifacts:
    paths:
      - ${APP_NAME}-linux-amd64
    expire_in: 30 days

# 生成 Changelog 并创建 Release
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-windows
      artifacts: true
    - job: build-linux
      artifacts: true
  before_script:
    - apk add --no-cache git bash curl
  script:
    - chmod +x scripts/generate-changelog.sh
    - ./scripts/generate-changelog.sh "${CI_COMMIT_TAG}"
    - |
      for FILE in ${APP_NAME}-windows-amd64.exe ${APP_NAME}-linux-amd64; do
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file ${FILE} \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${APP_NAME}/${CI_COMMIT_TAG}/${FILE}"
      done
  release:
    name: "Release $CI_COMMIT_TAG"
    description: CHANGELOG.md
    tag_name: "$CI_COMMIT_TAG"
    ref: "$CI_COMMIT_SHA"
    assets:
      links:
        - name: "Windows Binary (amd64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${APP_NAME}/${CI_COMMIT_TAG}/${APP_NAME}-windows-amd64.exe"
        - name: "Linux Binary (amd64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${APP_NAME}/${CI_COMMIT_TAG}/${APP_NAME}-linux-amd64"